name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # =====================================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker images + smoke tests)
  # =====================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend
      BACKEND_IMAGE: fluxion-backend:ci
      ML_IMAGE: fluxion-ml-service:ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code/backend
          file: code/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Smoke test backend image
        shell: bash
        run: |
          set -euo pipefail

          uid="$(docker run --rm --entrypoint id "$BACKEND_IMAGE" -u)"
          if [ "$uid" = "0" ]; then
            echo "Backend image must not run as root"
            exit 1
          fi

          docker run -d --name fluxion-backend-ci -p 8000:8000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL="sqlite+aiosqlite:////tmp/ci.db" \
            -e ML_MODE=disabled \
            "$BACKEND_IMAGE"

          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "Backend container did not become healthy"
            exit 1
          fi

          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/ml/risk/overview)"
          if [ "$status" != "503" ]; then
            echo "Expected 503 from the ML route with ML disabled, got $status"
            exit 1
          fi

      - name: Show backend container logs
        if: failure()
        run: docker logs fluxion-backend-ci || true

      - name: Build ML service image
        uses: docker/build-push-action@v6
        with:
          context: code/ml_models
          file: code/ml_models/Dockerfile
          push: false
          load: true
          tags: ${{ env.ML_IMAGE }}
          cache-from: type=gha,scope=ml-service
          cache-to: type=gha,mode=max,scope=ml-service

      - name: Smoke test ML service image
        shell: bash
        run: |
          set -euo pipefail

          uid="$(docker run --rm --entrypoint id "$ML_IMAGE" -u)"
          if [ "$uid" = "0" ]; then
            echo "ML service image must not run as root"
            exit 1
          fi

          docker run -d --name fluxion-ml-ci -p 8001:8000 \
            -e ML_AUTO_BOOTSTRAP=false \
            -e ML_SERVICE_API_KEY=ci-test-key \
            "$ML_IMAGE"

          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health > /dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "ML service container did not become healthy"
            exit 1
          fi

          check() {
            expected="$1"
            shift
            status="$(curl -s -o /dev/null -w '%{http_code}' "$@")"
            if [ "$status" != "$expected" ]; then
              echo "Expected $expected, got $status for: $*"
              exit 1
            fi
          }

          check 503 http://localhost:8001/ready
          check 401 -X POST http://localhost:8001/v1/risk/assess \
            -H "Content-Type: application/json" -d '{}'
          check 422 -X POST http://localhost:8001/v1/risk/assess \
            -H "Content-Type: application/json" -H "X-API-Key: ci-test-key" -d '{}'

      - name: Show ML service container logs
        if: failure()
        run: docker logs fluxion-ml-ci || true

      - name: Clean up containers
        if: always()
        run: docker rm -f fluxion-backend-ci fluxion-ml-ci || true

  # ============================================================
  # Job 3 -- ML Models Test & Validation (Pytest + coverage)
  # ============================================================
  ml_models_test:
    name: ML Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      ML_MODELS_DIR: code/ml_models
      # ml_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code
      # Make sure nothing tries to use a GPU on the runner.
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/ml_models/requirements.txt

      # Same pinned set and CPU-only PyTorch index as the ML service Dockerfile.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r "${ML_MODELS_DIR}/requirements.txt"
          python -m pip install pytest pytest-cov

      - name: Byte-compile all ml_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling config, core, data, networks, forecasting, risk, anomaly, serving, cli and tests ==="
          python -m compileall -q "${ML_MODELS_DIR}"

      - name: Verify public API and sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import ml_models

          for name in ml_models.__all__:
              getattr(ml_models, name)
              print(f"OK   ml_models.{name}")

          for module in (
              "config.constants",
              "config.settings",
              "core.artifacts",
              "core.registry",
              "core.training",
              "data.features",
              "data.pipeline",
              "data.synthetic",
              "networks.architectures",
              "forecasting.common",
              "forecasting.liquidity",
              "forecasting.supply_chain",
              "risk.compliance",
              "risk.risk_model",
              "anomaly.detector",
              "serving.app",
              "serving.handlers",
              "serving.metrics",
              "serving.server",
              "serving.service",
              "cli.train",
          ):
              importlib.import_module(f"ml_models.{module}")
              print(f"OK   ml_models.{module}")
          print(f"ml_models {ml_models.__version__} imports cleanly")
          PY

      - name: Run ml_models test suite
        working-directory: ${{ env.ML_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --cov=ml_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ml_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-models-coverage-report
          path: code/ml_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 5 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 6 -- Smart Contracts (Foundry) Compile & Test
  # ============================================================
  blockchain_tests:
    name: Smart Contracts Compile & Test
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry version
        run: forge --version

      - name: Install Foundry dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v4.9.6 --no-git
          forge install smartcontractkit/chainlink-brownie-contracts@1.2.0 --no-git
          forge install foundry-rs/forge-std --no-git

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            code/blockchain/cache
            code/blockchain/out
          key: foundry-${{ runner.os }}-${{ hashFiles('code/blockchain/foundry.lock', 'code/blockchain/foundry.toml', 'code/blockchain/contracts/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Compile contracts
        run: forge build --sizes

      - name: Run contract test suite
        run: forge test -vvv --gas-report

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-build-artifacts
          path: code/blockchain/out
          retention-days: 7

  # ============================================================
  # Job 7 -- Docs Validation
  # ============================================================
  docs_validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Markdown (docs/ and root README)
        run: |
          set -euo pipefail
          # Line length is left to Prettier (code_quality job); inline HTML is
          # allowed for the badges/images in the README.
          cat > "$RUNNER_TEMP/markdownlint.jsonc" <<'EOF'
          {
            "config": {
              "default": true,
              "MD013": false,
              "MD033": {
                "allowed_elements": ["img", "div", "p", "br", "a", "picture", "source", "details", "summary"]
              }
            }
          }
          EOF
          npx --yes markdownlint-cli2@0.24.0 --config "$RUNNER_TEMP/markdownlint.jsonc" "docs/**/*.md" README.md

      - name: Install lychee (link checker)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=1 --wildcards '*/lychee'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check internal links and anchors
        run: |
          lychee --offline --no-progress --include-fragments \
            'docs/**/*.md' README.md scripts/README.md infrastructure/README.md .github/readme/README.md

      - name: Validate code samples (python, bash, json)
        run: |
          python - <<'PY'
          import ast, json, pathlib, re, subprocess, sys

          FENCE = re.compile(r"^```([A-Za-z0-9_+-]*)[^\n]*\n(.*?)^```", re.S | re.M)
          failures = checked = 0
          files = sorted(pathlib.Path("docs").rglob("*.md")) + [pathlib.Path("README.md")]
          for path in files:
              text = path.read_text(encoding="utf-8")
              for m in FENCE.finditer(text):
                  lang, body = m.group(1).lower(), m.group(2)
                  line = text.count("\n", 0, m.start()) + 1
                  err = None
                  if lang in ("python", "py"):
                      try:
                          ast.parse(body)
                      except SyntaxError as e:
                          err = f"python: {e.msg} (block line {e.lineno})"
                  elif lang in ("bash", "sh", "shell"):
                      r = subprocess.run(["bash", "-n"], input=body, text=True, capture_output=True)
                      if r.returncode:
                          err = "bash: " + r.stderr.strip().splitlines()[-1]
                  elif lang == "json":
                      try:
                          json.loads(body)
                      except ValueError as e:
                          err = f"json: {e}"
                  else:
                      continue
                  checked += 1
                  if err:
                      failures += 1
                      print(f"::error file={path},line={line}::{err}")
          print(f"Checked {checked} code blocks, {failures} invalid")
          sys.exit(1 if failures else 0)
          PY

      - name: Check docs are consistent with the repository
        run: |
          set -euo pipefail
          status=0

          # Every script in scripts/ must be documented in docs/CLI.md, and vice versa.
          # Script names may contain hyphens (lint-all.sh), so the pattern allows them.
          scripts=$(for f in scripts/*.sh; do basename "$f"; done | sort)
          # shellcheck disable=SC2016  # the backticks are literal Markdown code spans
          documented=$(grep -oE '`[A-Za-z0-9_-]+\.sh`' docs/CLI.md | tr -d '`' | sort -u)
          for s in $(comm -23 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::scripts/$s exists but is not documented in docs/CLI.md"; status=1
          done
          for s in $(comm -13 <(echo "$scripts") <(echo "$documented")); do
            echo "::error file=docs/CLI.md::docs/CLI.md documents $s but scripts/$s does not exist"; status=1
          done

          # Every page in docs/ must be reachable from the docs index.
          for f in docs/*.md docs/examples/*.md; do
            name=${f#docs/}
            [ "$name" = "README.md" ] && continue
            grep -q "($name)" docs/README.md || { echo "::error file=$f::not linked from docs/README.md"; status=1; }
          done

          # Large binaries bloat clones; warn only.
          while IFS= read -r big; do
            echo "::warning file=$big::file is larger than 5 MB; consider compressing it (e.g. PNG/WebP instead of BMP)"
          done < <(find docs -type f -size +5M)

          exit "$status"

      - name: Check external links (advisory)
        continue-on-error: true
        run: |
          lychee --no-progress --max-retries 2 --timeout 20 --accept '200..=299,429' \
            'docs/**/*.md' README.md

  # ============================================================
  # Job 8 -- Infrastructure Validation
  # (Terraform, Kubernetes, Ansible, Docker)
  # ============================================================
  infrastructure_validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 30

    env:
      KUBERNETES_VERSION: "1.28.0"
      KUBECONFORM_VERSION: "0.8.0"
      HADOLINT_VERSION: "2.15.1"
      ANSIBLE_CONFIG: ${{ github.workspace }}/infrastructure/ansible/ansible.cfg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements-ci.txt

      - name: Install CI tooling (pinned in infrastructure/requirements-ci.txt)
        run: python -m pip install -r infrastructure/requirements-ci.txt

      # ---- Terraform ----------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        working-directory: infrastructure/terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Check every enable_* toggle is wired up
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          status=0
          while read -r v; do
            if ! grep -qE "var\\.${v}\\b" main.tf; then
              echo "::error file=infrastructure/terraform/variables.tf::variable ${v} is declared but never used in main.tf"
              status=1
            fi
          done < <(grep -ohE 'variable "enable_[a-z0-9_]+"' variables.tf | cut -d'"' -f2)
          exit "$status"

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0

      - name: TFLint (fails on errors, prints warnings)
        working-directory: infrastructure/terraform
        run: tflint --recursive --minimum-failure-severity=error

      # ---- Kubernetes ---------------------------------------
      - name: Install kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The manifests are plain YAML (there is no kustomization), so they are
      # validated as written. No cluster is needed.
      - name: Validate Kubernetes manifests
        working-directory: infrastructure/kubernetes
        run: |
          set -euo pipefail
          kubeconform -kubernetes-version "$KUBERNETES_VERSION" -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            base synthetic-engine.yaml

      # environments/*/values.yaml are per-environment value sets, not manifests,
      # so they are checked for consistency with each other instead.
      - name: Validate Kubernetes environment values
        working-directory: infrastructure/kubernetes
        run: |
          python - <<'PY'
          import sys, yaml

          envs = ("dev", "staging", "prod")
          values = {}
          for env in envs:
              with open(f"environments/{env}/values.yaml") as f:
                  values[env] = yaml.safe_load(f)

          problems = []
          reference = set(values["dev"])
          for env, data in values.items():
              if data.get("environment") != env:
                  problems.append(f"{env}: environment is {data.get('environment')!r}, expected {env!r}")
              if set(data) != reference:
                  problems.append(f"{env}: top-level keys differ from dev: {sorted(set(data) ^ reference)}")
              for component in ("backend", "frontend"):
                  tag = str(data[component]["image"]["tag"])
                  if env == "prod" and tag in ("latest", "dev", "staging"):
                      problems.append(f"prod: {component} image tag {tag!r} is not a release tag")
          for p in problems:
              print(f"::error::{p}")
          print("Environment values OK" if not problems else f"{len(problems)} problem(s)")
          sys.exit(1 if problems else 0)
          PY

      # ---- Ansible ------------------------------------------
      - name: Install Ansible collections
        working-directory: infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          if [ ! -f inventory/hosts.yml ]; then
            echo "::notice::inventory/hosts.yml is not tracked; validating with the example inventory"
            mkdir -p inventory
            cp inventory.example inventory/hosts.yml
          fi
          ansible-playbook --syntax-check playbooks/main.yml

      - name: Check every play matches at least one host
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          empty=$(ansible-playbook --list-hosts playbooks/main.yml | awk '/^ *play #/{play=$0} /hosts \(0\)/{print play}')
          if [ -n "$empty" ]; then
            while IFS= read -r line; do
              echo "::error::play matches no hosts: $line"
            done <<< "$empty"
            exit 1
          fi

      - name: ansible-lint (content must load; full style rules are not enforced)
        working-directory: infrastructure/ansible
        run: ansible-lint --offline --profile min .

      - name: Check role template and include references resolve
        working-directory: infrastructure/ansible
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          def walk(tasks):
              for task in tasks or []:
                  yield task
                  for key in ("block", "rescue", "always"):
                      yield from walk(task.get(key))

          bad = 0
          for tasks_file in sorted(pathlib.Path("roles").glob("*/tasks/*.yml")):
              role = tasks_file.parents[1]
              for task in walk(yaml.safe_load(tasks_file.read_text())):
                  for mod in ("template", "ansible.builtin.template"):
                      if mod in task:
                          src = task[mod]["src"]
                          if "{{" not in src and not (role / "templates" / src).exists():
                              print(f"::error file=infrastructure/ansible/{tasks_file}::template {src} does not exist in {role}/templates")
                              bad += 1
                  for mod in ("include_tasks", "import_tasks", "ansible.builtin.include_tasks", "ansible.builtin.import_tasks"):
                      if mod in task:
                          ref = task[mod] if isinstance(task[mod], str) else task[mod].get("file")
                          if ref and "{{" not in ref and not (tasks_file.parent / ref).exists():
                              print(f"::error file=infrastructure/ansible/{tasks_file}::{mod} {ref} does not exist")
                              bad += 1
          print("All references resolve" if not bad else f"{bad} unresolved reference(s)")
          sys.exit(1 if bad else 0)
          PY

      # Rendering with Ansible's own engine catches undefined variables, recursive
      # variables and template syntax errors that a syntax check cannot. Each role's
      # defaults are loaded first and its vars second, which is Ansible's own
      # precedence. The passwords are supplied by the operator in real runs, so
      # throwaway values are passed here.
      - name: Render role templates and lint the generated scripts
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rendered"
          cat > "$RUNNER_TEMP/render.yml" <<'EOF'
          - hosts: localhost
            connection: local
            gather_facts: true
            tasks:
              - name: Find the role's defaults and vars files
                ansible.builtin.stat:
                  path: "{{ role_dir }}/{{ item }}/main.yml"
                loop: [defaults, vars]
                register: role_var_files

              - name: Load them in Ansible's own precedence order (defaults, then vars)
                ansible.builtin.include_vars:
                  file: "{{ item.stat.path }}"
                loop: "{{ role_var_files.results }}"
                when: item.stat.exists

              - name: Render every template in the role
                ansible.builtin.template:
                  src: "{{ item }}"
                  dest: "{{ out_dir }}/{{ item | basename | regex_replace('[.]j2$', '') }}"
                  mode: "0644"
                with_fileglob: "{{ role_dir }}/templates/*.j2"
          EOF
          for tpl_dir in roles/*/templates; do
            role=$(basename "$(dirname "$tpl_dir")")
            mkdir -p "$RUNNER_TEMP/rendered/$role"
            echo "=== Rendering role: $role ==="
            ansible-playbook -i localhost, "$RUNNER_TEMP/render.yml" \
              -e "role_dir=$PWD/roles/$role" -e "out_dir=$RUNNER_TEMP/rendered/$role" \
              -e db_password=ci-only -e db_root_password=ci-only \
              -e db_backup_password=ci-only -e db_monitor_password=ci-only
          done
          find "$RUNNER_TEMP/rendered" -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=warning -s bash

      - name: yamllint (Kubernetes, Ansible, Compose, config)
        working-directory: infrastructure
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" \
            kubernetes/base ansible docker-compose.yml docker-compose.zk.yml config

      # ---- Docker -------------------------------------------
      # The two files are validated on their own: the zk file attaches to the
      # network created by the main file (external: true), so merging them with
      # -f -f is not a valid configuration.
      - name: Validate Docker Compose files
        working-directory: infrastructure
        run: |
          set -euo pipefail
          # The compose file requires secrets via ${VAR:?}; use the example values.
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.zk.yml config --quiet

      - name: Lint Dockerfiles (fails on errors, prints warnings)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x "$HOME/.local/bin/hadolint"
          hadolint --failure-threshold error \
            code/backend/Dockerfile code/ml_models/Dockerfile web-frontend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The backend and ML service images are built in the Backend job; build the
      # web frontend one here.
      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: web-frontend
          file: web-frontend/Dockerfile
          push: false
          tags: fluxion-frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

      # ---- Secrets ------------------------------------------
      # A value that starts with $ or { is a variable or template reference, not a
      # literal secret.
      - name: Scan infrastructure for hard-coded secrets
        working-directory: infrastructure
        run: |
          set -uo pipefail
          found=0
          for pattern in 'password\s*=\s*"[^"${][^"]{7,}"' 'secret\s*=\s*"[^"${][^"]{7,}"' 'api[_-]key\s*=\s*"[^"${][^"]{7,}"' 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY'; do
            hits=$(grep -rEIin "$pattern" terraform kubernetes ansible \
              | grep -v '\.example' \
              | grep -viE 'placeholder|change_?me|:[0-9]+:\s*#' || true)
            if [ -n "$hits" ]; then
              echo "::error::possible hard-coded secret matching /$pattern/"
              echo "$hits"
              found=1
            fi
          done
          exit "$found"

  # ============================================================
  # Job 9 -- Scripts Validation
  # ============================================================
  scripts_validation:
    name: Scripts Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ShellCheck
        run: python -m pip install shellcheck-py==0.11.0.1

      - name: ShellCheck all tracked shell scripts (fails on warnings and errors)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

      - name: ShellCheck stricter style findings (advisory)
        continue-on-error: true
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=info

      - name: Check syntax and shebang of all tracked shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
            head -n 1 "$f" | grep -qE '^#!.*(bash|sh)' || { echo "::error file=$f::missing shebang"; exit 1; }
          done < <(git ls-files -z '*.sh')

      - name: Check shell scripts are executable in git
        run: |
          missing=$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$missing" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::not executable in git. Fix: git update-index --chmod=+x $f"
            done <<< "$missing"
            exit 1
          fi

      # Only scripts with a real --help handler are listed: the others
      # (run_fluxion.sh, test_fluxion.sh, setup_fluxion_env.sh, ...) would start
      # services, run test suites or create a virtualenv instead of printing usage.
      - name: Smoke test --help on CLI scripts
        run: |
          set -uo pipefail
          status=0
          before=$(git status --porcelain)
          for s in ai_ml_pipeline cross_chain_test deploy_multi_env monitoring_setup; do
            if out=$(timeout 30 bash "scripts/$s.sh" --help </dev/null 2>&1) && grep -qi 'usage' <<< "$out"; then
              echo "OK   $s.sh --help"
            else
              echo "::error file=scripts/$s.sh::--help did not exit 0 with a usage message"
              status=1
            fi
          done
          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "::error::--help modified the working tree:"; git status --porcelain; status=1
          fi
          exit "$status"
