name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # =====================================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker images + smoke tests)
  # =====================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend
      BACKEND_IMAGE: fluxion-backend:ci
      ML_IMAGE: fluxion-ml-service:ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: code/backend
          file: code/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Smoke test backend image
        shell: bash
        run: |
          set -euo pipefail

          uid="$(docker run --rm --entrypoint id "$BACKEND_IMAGE" -u)"
          if [ "$uid" = "0" ]; then
            echo "Backend image must not run as root"
            exit 1
          fi

          docker run -d --name fluxion-backend-ci -p 8000:8000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL="sqlite+aiosqlite:////tmp/ci.db" \
            -e ML_MODE=disabled \
            "$BACKEND_IMAGE"

          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "Backend container did not become healthy"
            exit 1
          fi

          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/ml/risk/overview)"
          if [ "$status" != "503" ]; then
            echo "Expected 503 from the ML route with ML disabled, got $status"
            exit 1
          fi

      - name: Show backend container logs
        if: failure()
        run: docker logs fluxion-backend-ci || true

      - name: Build ML service image
        uses: docker/build-push-action@v6
        with:
          context: code/ml_models
          file: code/ml_models/Dockerfile
          push: false
          load: true
          tags: ${{ env.ML_IMAGE }}
          cache-from: type=gha,scope=ml-service
          cache-to: type=gha,mode=max,scope=ml-service

      - name: Smoke test ML service image
        shell: bash
        run: |
          set -euo pipefail

          uid="$(docker run --rm --entrypoint id "$ML_IMAGE" -u)"
          if [ "$uid" = "0" ]; then
            echo "ML service image must not run as root"
            exit 1
          fi

          docker run -d --name fluxion-ml-ci -p 8001:8000 \
            -e ML_AUTO_BOOTSTRAP=false \
            -e ML_SERVICE_API_KEY=ci-test-key \
            "$ML_IMAGE"

          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health > /dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "ML service container did not become healthy"
            exit 1
          fi

          check() {
            expected="$1"
            shift
            status="$(curl -s -o /dev/null -w '%{http_code}' "$@")"
            if [ "$status" != "$expected" ]; then
              echo "Expected $expected, got $status for: $*"
              exit 1
            fi
          }

          check 503 http://localhost:8001/ready
          check 401 -X POST http://localhost:8001/v1/risk/assess \
            -H "Content-Type: application/json" -d '{}'
          check 422 -X POST http://localhost:8001/v1/risk/assess \
            -H "Content-Type: application/json" -H "X-API-Key: ci-test-key" -d '{}'

      - name: Show ML service container logs
        if: failure()
        run: docker logs fluxion-ml-ci || true

      - name: Clean up containers
        if: always()
        run: docker rm -f fluxion-backend-ci fluxion-ml-ci || true

  # ============================================================
  # Job 3 -- ML Models Test & Validation (Pytest + coverage)
  # ============================================================
  ml_models_test:
    name: ML Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      ML_MODELS_DIR: code/ml_models
      # ml_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code
      # Make sure nothing tries to use a GPU on the runner.
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/ml_models/requirements.txt

      # Same pinned set and CPU-only PyTorch index as the ML service Dockerfile.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r "${ML_MODELS_DIR}/requirements.txt"
          python -m pip install pytest pytest-cov

      - name: Byte-compile all ml_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling config, core, data, networks, forecasting, risk, anomaly, serving, cli and tests ==="
          python -m compileall -q "${ML_MODELS_DIR}"

      - name: Verify public API and sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          import ml_models

          for name in ml_models.__all__:
              getattr(ml_models, name)
              print(f"OK   ml_models.{name}")

          for module in (
              "config.constants",
              "config.settings",
              "core.artifacts",
              "core.registry",
              "core.training",
              "data.features",
              "data.pipeline",
              "data.synthetic",
              "networks.architectures",
              "forecasting.common",
              "forecasting.liquidity",
              "forecasting.supply_chain",
              "risk.compliance",
              "risk.risk_model",
              "anomaly.detector",
              "serving.app",
              "serving.handlers",
              "serving.metrics",
              "serving.server",
              "serving.service",
              "cli.train",
          ):
              importlib.import_module(f"ml_models.{module}")
              print(f"OK   ml_models.{module}")
          print(f"ml_models {ml_models.__version__} imports cleanly")
          PY

      - name: Run ml_models test suite
        working-directory: ${{ env.ML_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --cov=ml_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload ml_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-models-coverage-report
          path: code/ml_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================
  # Job 4 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 5 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 6 -- Smart Contracts (Foundry) Compile & Test
  # ============================================================
  blockchain_tests:
    name: Smart Contracts Compile & Test
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry version
        run: forge --version

      - name: Install Foundry dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v4.9.6 --no-git
          forge install smartcontractkit/chainlink-brownie-contracts@1.2.0 --no-git
          forge install foundry-rs/forge-std --no-git

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            code/blockchain/cache
            code/blockchain/out
          key: foundry-${{ runner.os }}-${{ hashFiles('code/blockchain/foundry.lock', 'code/blockchain/foundry.toml', 'code/blockchain/contracts/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Compile contracts
        run: forge build --sizes

      - name: Run contract test suite
        run: forge test -vvv --gas-report

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-build-artifacts
          path: code/blockchain/out
          retention-days: 7
