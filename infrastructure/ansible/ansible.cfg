[defaults]
# Roles live in ansible/roles, but the playbook is in ansible/playbooks, so
# Ansible's default lookup (playbooks/roles) misses them. Point roles_path at
# the real location so `ansible-playbook playbooks/main.yml` and `ansible-lint`
# resolve the common/security/webserver/database roles.
roles_path = roles
inventory = inventory/hosts.yml
host_key_checking = True
retry_files_enabled = False
# The community.general.yaml callback was removed in community.general 12.0.0;
# the built-in default callback with result_format=yaml replaces it.
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
